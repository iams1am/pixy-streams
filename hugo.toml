baseURL = "https://iams1am.github.io/pixy-streams/"
languageCode = "en-us"
title = "Pixy Streams"
theme = "alert"

[params]
  description = "Discover movies, TV series, anime and live sport in one place."
  tagline = "Movies, TV, anime and sport - all in one place"
  keywords = "movies, TV, series, anime, sport, streaming, watch online, trailers, where to watch"
  author = "Pixy Streams"
  logoText = "Pixy"
  logoAccent = "Streams"

  # Playback: the region a verified playback source must cover (ISO 3166-1).
  playbackRegion = "US"

  # Brand
  themeColor = "#ff6b35"

  # Social / contact
  github = "https://github.com/iams1am/pixy-streams"
  facebook = ""
  linkedin = ""
  email = ""

  # Feature flags (used by templates)
  showAttribution = true

