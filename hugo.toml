[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[taxonomies]
  genre = "genres"

[outputs]
  home = ["HTML", "RSS", "search"]

# Build-time search index consumed by the header search box.
[mediaTypes."application/json"]
  suffixes = ["json"]

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true
