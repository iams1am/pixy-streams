{{- $items := .items | default slice -}}
{{- if $items -}}
<section class="rail-section container"{{ with .id }} id="{{ . }}"{{ end }}>
  <div class="rail-header">
    <div class="rail-heading">
      <h2>{{ .title }}</h2>
      {{ with .subtitle }}<p class="rail-subtitle">{{ . }}</p>{{ end }}
    </div>
    {{ with .href }}<a href="{{ partial "link.html" . }}" class="rail-link">View all &rarr;</a>{{ end }}
  </div>
  <div class="rail">
    {{- range $items -}}
      {{ partial "rail-card.html" . }}
    {{- end -}}
  </div>
</section>
{{- end -}}
