{{- $terms := site.Taxonomies.genres -}}
{{- with $terms -}}
<section class="specialties-section container" id="genres">
  <h2>Browse by genre</h2>
  <div class="specialties-grid">
    {{- range $name, $pages := . }}
    {{- $term := site.GetPage (printf "/genres/%s" $name) }}
    <a class="specialty-item" href="{{ with $term }}{{ .RelPermalink }}{{ else }}{{ partial "link.html" (printf "/genres/%s/" $name) }}{{ end }}">
      <svg class="specialty-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>{{ with $term }}{{ .Title }}{{ else }}{{ $name }}{{ end }}</span>
      <span class="specialty-count">{{ len $pages }}</span>
    </a>
    {{- end }}
  </div>
</section>
{{- end -}}
