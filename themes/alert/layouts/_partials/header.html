<header class="site-header">
  <nav class="navbar container">
    <div class="navbar-brand">
      <a href="{{ "" | relURL }}" class="logo" aria-label="{{ site.Title }} home">
        <span class="logo-text">{{ site.Params.logoText | default "Pixy" }}<span class="logo-accent">{{ site.Params.logoAccent | default "Streams" }}</span></span>
      </a>
    </div>
    
    <button class="navbar-toggle" aria-label="Toggle navigation">
      <span class="toggle-icon"></span>
      <span class="toggle-icon"></span>
      <span class="toggle-icon"></span>
    </button>
    
    <div class="navbar-menu">
      <ul class="navbar-nav">
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
        <li class="nav-item {{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}">
          {{ if .HasChildren }}
          <div class="nav-item-dropdown">
            <a href="{{ .URL }}" class="nav-link">
              {{ .Name }}
              <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </a>
            <div class="dropdown-menu">
              {{ range .Children }}
              <a href="{{ .URL }}" class="dropdown-item">{{ .Name }}</a>
              {{ end }}
            </div>
          </div>
          {{ else }}
          <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
          {{ end }}
        </li>
        {{ end }}
      </ul>
      
      <div class="navbar-actions">
        <div class="site-search" role="search" data-search data-index="{{ partial "link.html" "/search.json" }}">
          <form class="search-form" data-search-form>
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
            <input type="search" class="search-input" data-search-input placeholder="Search titles" aria-label="Search titles" role="combobox" aria-autocomplete="list" autocomplete="off" spellcheck="false" aria-expanded="false" aria-controls="search-results">
          </form>
          <div class="search-results" id="search-results" data-search-results role="listbox" aria-label="Search results" hidden></div>
        </div>
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>
</header>
