{{ define "main" }}
<div class="page-header">
  <div class="container">
    <p class="hero-eyebrow">Error 404</p>
    <h1>That page left the catalogue</h1>
    <p class="page-description">
      The link is broken, the title was renamed, or it never existed. Nothing crashed -
      it is just not here.
    </p>
  </div>
</div>

<div class="container page-content">
  <div class="content-main">
    <div class="quick-links-grid">
      <a href="{{ partial "link.html" "/" }}" class="quick-link-card">
        <div class="quick-link-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <h2>Home</h2>
      </a>
      <a href="{{ partial "link.html" "/movies/" }}" class="quick-link-card">
        <div class="quick-link-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="18" rx="2"></rect>
            <line x1="7" y1="3" x2="7" y2="21"></line>
            <line x1="17" y1="3" x2="17" y2="21"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
          </svg>
        </div>
        <h2>Movies</h2>
      </a>
      <a href="{{ partial "link.html" "/anime/" }}" class="quick-link-card">
        <div class="quick-link-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"></path>
            <path d="M18 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1L15 18l2.1-.9z"></path>
          </svg>
        </div>
        <h2>Anime</h2>
      </a>
      <a href="{{ partial "link.html" "/sports/" }}" class="quick-link-card">
        <div class="quick-link-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 21h8"></path>
            <path d="M12 17v4"></path>
            <path d="M7 4h10v5a5 5 0 0 1-10 0z"></path>
            <path d="M17 5h3v2a3 3 0 0 1-3 3"></path>
            <path d="M7 5H4v2a3 3 0 0 0 3 3"></path>
          </svg>
        </div>
        <h2>Sports</h2>
      </a>
    </div>
  </div>
</div>
{{ end }}
