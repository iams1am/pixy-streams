{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <p class="page-description">Every genre in the catalogue.</p>
  </div>
</div>

<div class="container page-content">
  <div class="content-main">
    {{ .Content }}
    <div class="genre-hub">
      {{ range .Pages }}
      <a class="genre-hub-card" href="{{ .RelPermalink }}">
        <span>{{ .Title }}</span>
        <span class="genre-hub-count">{{ len .Pages }}</span>
      </a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
